name: Backend tests
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: helpdesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test-password@localhost:5432/helpdesk_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password@localhost:5432/helpdesk_test
      ALLOW_TEST_DATABASE_RESET: '1'
      SECRET_KEY: ci-test-only-secret-12345678901234567890
      DEMO_PASSWORD: ci-demo-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python seed/seed.py
      - run: python seed/seed.py
      - run: pytest -q
